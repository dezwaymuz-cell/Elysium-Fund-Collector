<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elysium Fund">
<title>Elysium Fund</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ea;--card:#fff;--ink:#16201b;--mute:#6f7a74;--line:#e8e5db;
  --g1:#0f5c3e;--g2:#1c8a5b;--green:#1a7f55;--green-bg:#e3f4ec;
  --red:#c2412d;--red-bg:#fbe9e5;
  --shadow:0 1px 2px rgba(20,30,25,.05),0 6px 18px rgba(20,30,25,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;padding-bottom:150px;touch-action:manipulation;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.wrap{max-width:480px;margin:0 auto;padding:0 14px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 4px}
.logo{display:flex;align-items:center;gap:10px}
.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:18px;box-shadow:0 4px 12px rgba(15,92,62,.35)}
.logo b{font-size:17px;display:block;line-height:1.1;font-weight:700}
.logo span{font-size:12px;color:var(--mute)}
.icbtn{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.icbtn svg{width:19px;height:19px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;color:#fff;margin:12px 0 12px;background:linear-gradient(140deg,var(--g1) 0%,var(--g2) 100%);box-shadow:0 14px 30px rgba(15,92,62,.28)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.hero:before{width:170px;height:170px;right:-50px;top:-70px}
.hero:after{width:110px;height:110px;right:50px;bottom:-65px}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:36px;font-weight:800;margin:2px 0 14px;line-height:1.1;letter-spacing:-.02em}
.hero .title{font-size:21px;font-weight:700;line-height:1.25;padding-right:84px;word-break:break-word}
.hero .sub{font-size:12.5px;opacity:.8;margin-bottom:4px}
.prog{height:8px;background:rgba(255,255,255,.22);border-radius:8px;overflow:hidden;margin:2px 0 7px}
.prog i{display:block;height:100%;background:#fff;border-radius:8px;transition:width .6s}
.progtxt{font-size:12px;opacity:.88}
.heroedit{position:absolute;right:14px;top:14px;z-index:2;background:rgba(255,255,255,.2);border:0;border-radius:11px;color:#fff;padding:8px 14px;font-size:13px;font-weight:600}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.tile .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;margin-bottom:8px}
.tile.in .ic{background:var(--green-bg)}.tile.out .ic{background:var(--red-bg)}
.tile .l{font-size:12.5px;color:var(--mute)}
.tile .v{font-size:20px;font-weight:700;letter-spacing:-.01em}
.tile.in .v{color:var(--green)}.tile.out .v{color:var(--red)}

/* sections */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:24px 2px 10px}
.sec h2{font-size:16px;margin:0;font-weight:700}
.sec small{color:var(--mute);font-size:12.5px}
.box{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.click{cursor:pointer}.row.click:active{background:#f7f5ee}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.mid{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap;text-align:right;font-size:15px}
.amt small{display:block;font-weight:500;font-size:11.5px;color:var(--mute)}
.in{color:var(--green)}.out{color:var(--red)}
.empty{padding:34px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;font-size:34px;margin-bottom:6px;font-weight:400}
.empty p{margin:2px 0 0;font-size:14px}

/* chart */
.chart{display:flex;align-items:flex-end;gap:8px;height:170px;padding:18px 14px 12px;overflow-x:auto}
.col{flex:1;min-width:36px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.col .m{font-size:10.5px;font-weight:600;margin-bottom:4px;white-space:nowrap}
.col .b{width:100%;max-width:42px;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,var(--g2),var(--g1));min-height:4px;transition:height .6s}
.col .d{font-size:11px;color:var(--mute);margin-top:6px}

/* segmented + search */
.seg{display:grid;grid-template-columns:1fr 1fr;background:#e7e4da;border-radius:14px;padding:4px;margin:16px 0 12px}
.seg button{border:0;background:none;padding:12px 8px;border-radius:11px;font-weight:600;color:var(--mute);transition:.2s}
.seg button.on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.seg button.on.i{color:var(--green)}.seg button.on.o{color:var(--red)}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;padding:13px 14px 13px 42px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:0;font-size:16px}
.search input:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(28,138,91,.15)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute)}
.datehead{font-size:12px;font-weight:600;color:var(--mute);padding:9px 14px;background:#faf9f4;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}

/* programme cards */
.pcard{padding:14px;border-bottom:1px solid var(--line);cursor:pointer}
.pcard:last-child{border-bottom:0}.pcard:active{background:#f7f5ee}
.pcard .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pcard .bar{height:6px;border-radius:6px;background:var(--red-bg);margin:10px 0 6px;overflow:hidden}
.pcard .bar i{display:block;height:100%;background:var(--red);border-radius:6px}
.pcard .f{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute)}

/* bottom nav + fab */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
.nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.nav button{border:0;background:none;padding:7px;border-radius:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--g1)}
.fabbox{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));z-index:11;pointer-events:none}
.fabbox div{max-width:480px;margin:0 auto;padding:0 14px}
.fab{pointer-events:auto;width:100%;border:0;border-radius:18px;padding:15px 20px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-weight:700;font-size:16px;box-shadow:0 10px 24px rgba(15,92,62,.4);display:flex;align-items:center;justify-content:center;gap:8px}
.fab.red{background:linear-gradient(135deg,#a8321f,#d4553f);box-shadow:0 10px 24px rgba(194,65,45,.4)}
.fab:active{transform:scale(.98)}
.fab svg{width:20px;height:20px}
.back{border:0;background:none;color:var(--g1);font-weight:600;padding:10px 0 6px;font-size:14.5px;margin-top:4px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(10,20,15,.5);display:none;align-items:flex-end;justify-content:center;z-index:50;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#modal.show{display:flex;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.grab{width:42px;height:5px;border-radius:5px;background:#dcd9ce;margin:0 auto 14px}
.sheet h3{margin:0 0 2px;font-size:20px;font-weight:700}
.sheet .hint{color:var(--mute);font-size:13px}
@media(min-width:600px){#modal{align-items:center}.sheet{border-radius:26px;padding-top:22px}.grab{display:none}}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:14px 0 6px}
.fld{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:#faf9f5;font-size:16px;outline:0;transition:.15s;-webkit-appearance:none;appearance:none;min-height:52px}
.fld:focus{border-color:var(--g2);background:#fff;box-shadow:0 0 0 4px rgba(28,138,91,.12)}
.money{position:relative}
.money span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-weight:700;font-size:22px;color:var(--mute)}
.money .fld{padding-left:40px;font-size:26px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:9px 16px;font-weight:600;font-size:14.5px}
.chip:active{background:var(--green-bg);border-color:var(--g2)}
.btns{display:flex;gap:10px;margin-top:22px}
.btns button{padding:15px;border-radius:15px;border:0;font-weight:700;font-size:16px}
.btn-save{flex:1;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 8px 18px rgba(15,92,62,.3)}
.btn-save.red{background:linear-gradient(135deg,#a8321f,#d4553f);box-shadow:0 8px 18px rgba(194,65,45,.3)}
.btn-save:disabled{opacity:.6}
.btn-x{background:#efede5;color:var(--ink)}
.btn-del{background:var(--red-bg);color:var(--red)}
.pm{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;vertical-align:middle;margin-left:4px;letter-spacing:.02em}
.pm.upi{background:#e6eefb;color:#2f5fa8}.pm.cash{background:#fbf1da;color:#a9741a}
.mseg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mseg button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px;font-weight:700;font-size:15px;color:var(--mute)}
.mseg button.on{border-color:#2f5fa8;background:#e6eefb;color:#2f5fa8}
.mseg button.on.cash{border-color:#a9741a;background:#fbf1da;color:#a9741a}
.fchips{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.fc{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--mute)}
.fc.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ftot{margin-left:auto;font-weight:700;font-size:14px}

/* skeleton / toast */
.sk{background:linear-gradient(90deg,#ebe8de 25%,#f6f4ec 50%,#ebe8de 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:18px}
@keyframes sh{to{background-position:-200% 0}}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-30px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.setup{max-width:420px;margin:14vh auto;padding:0 20px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== Paste your Supabase publishable key below ======
const SUPABASE_URL = 'https://vnmirsymtiyaqrscalfe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bCb0uRgNbIINlSJ_VwSOLw_7vyLZOAv';
// =======================================================

const IC = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'
};

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const S = { progs: [], inc: [], pay: [], view: 'dash', pid: null, tab: 'inc', q: '', m: 'all', loading: true };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const today = () => new Date().toLocaleDateString('en-CA');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dlong = d => { const [y, m, dd] = String(d).split('-'); return `${+dd} ${MON[+m - 1]} ${y}`; };
const dnice = d => d === today() ? 'Today' : d === new Date(Date.now() - 864e5).toLocaleDateString('en-CA') ? 'Yesterday' : dlong(d);
const sum = a => a.reduce((t, x) => t + Number(x.amount || 0), 0);
const M = x => x.method === 'cash' ? 'cash' : 'upi';
const badge = x => `<span class="pm ${M(x)}">${M(x) === 'cash' ? 'Cash' : 'UPI'}</span>`;
const handCash = (inc, pay) => sum(inc.filter(x => M(x) === 'cash')) - sum(pay.filter(x => M(x) === 'cash'));
const byDate = (a, b) => b.date.localeCompare(a.date) || (b.created_at || '').localeCompare(a.created_at || '');
const PAL = [['#e3f4ec','#1a7f55'],['#fbf1da','#a9741a'],['#e6eefb','#2f5fa8'],['#f6e6f3','#a1348f'],['#fbe9e5','#c2412d'],['#e5f3f5','#1b7a89']];
const avatar = n => { const s = String(n).trim(); let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0; const [bg, fg] = PAL[h % PAL.length]; return `<div class="av" style="background:${bg};color:${fg}">${esc([...s][0] || '?').toUpperCase()}</div>`; };

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2300); }

async function fetchAll(table) {
  let all = [], from = 0;
  while (true) {
    const { data, error } = await sb.from(table).select('*').range(from, from + 999);
    if (error) throw error;
    all = all.concat(data); if (data.length < 1000) break; from += 1000;
  }
  return all;
}
async function load() {
  try {
    [S.progs, S.inc, S.pay] = await Promise.all([fetchAll('programmes'), fetchAll('incomes'), fetchAll('payouts')]);
    S.progs.sort((a, b) => b.date.localeCompare(a.date) || b.created_at.localeCompare(a.created_at));
  } catch (e) { toast('Could not load: ' + e.message); }
  S.loading = false; render();
}

// ---------- shell ----------
function shell(inner, fab = '') {
  return `<div class="wrap"><div class="top">
    <div class="logo"><i>✦</i><div><b>Elysium Fund</b><span>Fest accounts</span></div></div>
    <button class="icbtn" data-a="csv" aria-label="Download CSV">${IC.down}</button></div>
    ${inner}</div>${fab ? `<div class="fabbox"><div>${fab}</div></div>` : ''}
    <div class="nav"><div>
      <button data-a="nav" data-v="dash" class="${S.view === 'dash' ? 'on' : ''}">${IC.home}Dashboard</button>
      <button data-a="nav" data-v="progs" class="${S.view !== 'dash' ? 'on' : ''}">${IC.list}Programmes</button>
    </div></div>`;
}
const fabProg = `<button class="fab" data-a="addprog">${IC.plus}New Programme</button>`;

function skeleton() {
  return shell(`<div class="sk" style="height:150px;margin:12px 0"></div>
    <div class="tiles"><div class="sk" style="height:100px"></div><div class="sk" style="height:100px"></div></div>
    <div class="sk" style="height:200px;margin-top:20px"></div>`);
}

function progRow(p) {
  const i = sum(S.inc.filter(x => x.programme_id === p.id)), o = sum(S.pay.filter(x => x.programme_id === p.id));
  const pct = i > 0 ? Math.min(100, o / i * 100) : 0;
  return `<div class="pcard" data-a="open" data-id="${p.id}"><div class="h">
      <div class="mid"><div class="t" style="font-size:16px">${esc(p.name)}</div><div class="s">${dlong(p.date)}</div></div>
      <div class="amt ${i - o >= 0 ? 'in' : 'out'}" style="font-size:17px">${fmt(i - o)}<small>balance</small></div></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="f"><span>Received <b class="in">${fmt(i)}</b></span><span>Given <b class="out">${fmt(o)}</b></span></div></div>`;
}

// ---------- dashboard ----------
function dashboard() {
  const tin = sum(S.inc), tout = sum(S.pay), pct = tin > 0 ? Math.min(100, tout / tin * 100) : 0;
  const pname = id => (S.progs.find(p => p.id === id) || {}).name || '—';

  const progs = S.progs.length ? S.progs.slice(0, 5).map(progRow).join('') +
    (S.progs.length > 5 ? `<div class="row click" data-a="nav" data-v="progs" style="justify-content:center;color:var(--g1);font-weight:600">View all (${S.progs.length})</div>` : '')
    : `<div class="empty"><b>🎪</b>Create your first programme<p>Tap "New Programme" below</p></div>`;

  const g = {};
  S.pay.forEach(x => { const k = x.paid_to.trim().toLowerCase(); g[k] = g[k] || { name: x.paid_to.trim(), total: 0, n: 0, r: new Set() }; g[k].total += Number(x.amount); g[k].n++; if (x.reason) g[k].r.add(x.reason); });
  const people = Object.values(g).sort((a, b) => b.total - a.total).map(p =>
    `<div class="row">${avatar(p.name)}<div class="mid"><div class="t">${esc(p.name)}</div><div class="s">${p.n} payment${p.n > 1 ? 's' : ''}${p.r.size ? ' · ' + esc([...p.r].slice(0, 3).join(', ')) : ''}</div></div>
     <div class="amt out">${fmt(p.total)}</div></div>`).join('')
    || `<div class="empty"><b>🤝</b>Nothing given out yet</div>`;

  const days = {}; S.inc.forEach(x => days[x.date] = (days[x.date] || 0) + Number(x.amount));
  const keys = Object.keys(days).sort().slice(-10), max = Math.max(1, ...keys.map(k => days[k]));
  const chart = keys.length ? `<div class="chart">${keys.map(k => `<div class="col"><div class="m">${days[k] >= 1000 ? (days[k] / 1000).toFixed(days[k] % 1000 ? 1 : 0) + 'k' : days[k]}</div>
    <div class="b" style="height:${Math.max(4, days[k] / max * 78)}%"></div><div class="d">${k.slice(8)}/${k.slice(5, 7)}</div></div>`).join('')}</div>`
    : `<div class="empty"><b>📊</b>Add some money to see the chart</div>`;

  const recent = [...S.inc.map(x => ({ ...x, k: 'in', who: x.name, sub: pname(x.programme_id) })),
    ...S.pay.map(x => ({ ...x, k: 'out', who: x.paid_to, sub: pname(x.programme_id) + (x.reason ? ' · ' + x.reason : '') }))]
    .sort(byDate).slice(0, 8).map(x => `<div class="row">${avatar(x.who)}<div class="mid"><div class="t">${esc(x.who)}</div>
      <div class="s">${dnice(x.date)} · ${esc(x.sub)}</div></div><div class="amt ${x.k}">${x.k === 'in' ? '+' : '−'}${fmt(x.amount)}</div></div>`).join('')
    || `<div class="empty"><b>🧾</b>No entries yet</div>`;

  return shell(`<div class="hero"><div class="lbl">Total balance</div>
      <div class="big">${fmt(tin - tout)}</div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="progtxt">${Math.round(pct)}% of collected money given out</div></div>
    <div class="tiles">
      <div class="tile in"><div class="ic">📥</div><div class="l">Total received</div><div class="v">${fmt(tin)}</div></div>
      <div class="tile out"><div class="ic">📤</div><div class="l">Total given</div><div class="v">${fmt(tout)}</div></div></div>
    <div class="tiles" style="margin-top:10px">
      <div class="tile"><div class="ic" style="background:#fbf1da">💵</div><div class="l">Hand cash</div><div class="v">${fmt(handCash(S.inc, S.pay))}</div></div>
      <div class="tile"><div class="ic" style="background:#e6eefb">📱</div><div class="l">UPI balance</div><div class="v">${fmt(tin - tout - handCash(S.inc, S.pay))}</div></div></div>
    <div class="sec"><h2>Programmes</h2></div><div class="box">${progs}</div>
    <div class="sec"><h2>Given to</h2><small>Ustads &amp; others</small></div><div class="box">${people}</div>
    <div class="sec"><h2>Daily collection</h2></div><div class="box">${chart}</div>
    <div class="sec"><h2>Recent activity</h2></div><div class="box">${recent}</div>`, fabProg);
}

function progList() {
  return shell(`<div class="sec" style="margin-top:18px"><h2>All programmes</h2><small>${S.progs.length} total</small></div>
    <div class="box">${S.progs.map(progRow).join('') || `<div class="empty"><b>🎪</b>Create your first programme<p>Tap "New Programme" below</p></div>`}</div>`, fabProg);
}

function progDetail() {
  const p = S.progs.find(x => x.id === S.pid);
  if (!p) { S.view = 'progs'; return progList(); }
  const inc = S.inc.filter(x => x.programme_id === p.id), pay = S.pay.filter(x => x.programme_id === p.id);
  const i = sum(inc), o = sum(pay), pct = i > 0 ? Math.min(100, o / i * 100) : 0;
  const q = S.q.trim().toLowerCase(), isIn = S.tab === 'inc';
  const items = (isIn ? inc.filter(x => !q || x.name.toLowerCase().includes(q)) : pay.filter(x => !q || (x.paid_to + ' ' + x.reason).toLowerCase().includes(q))).filter(x => S.m === 'all' || M(x) === S.m).sort(byDate);
  const hc = handCash(inc, pay);

  let list = '', last = '';
  items.forEach(x => {
    if (x.date !== last) {
      list += `<div class="datehead"><span>${dnice(x.date)}</span><span>${fmt(sum(items.filter(y => y.date === x.date)))}</span></div>`; last = x.date;
    }
    const who = isIn ? x.name : x.paid_to;
    list += `<div class="row click" data-a="edit" data-k="${S.tab}" data-id="${x.id}">${avatar(who)}<div class="mid"><div class="t">${esc(who)} ${badge(x)}</div>
      ${!isIn && x.reason ? `<div class="s">${esc(x.reason)}</div>` : ''}</div>
      <div class="amt ${isIn ? 'in' : 'out'}">${isIn ? '+' : '−'}${fmt(x.amount)}</div></div>`;
  });
  if (!items.length) list = q ? `<div class="empty"><b>🔍</b>No results</div>` :
    `<div class="empty"><b>${isIn ? '💰' : '🤝'}</b>${isIn ? 'No money received yet' : 'Nothing given out yet'}<p>Tap the button below to add</p></div>`;

  return shell(`<button class="back" data-a="nav" data-v="progs">‹ Programmes</button>
    <div class="hero" style="margin-top:4px"><button class="heroedit" data-a="editprog">Edit</button>
      <div class="sub">${dlong(p.date)}</div><div class="title">${esc(p.name)}</div>
      <div class="lbl" style="margin-top:14px">Balance</div><div class="big">${fmt(i - o)}</div>
      <div class="prog"><i style="width:${pct}%"></i></div><div class="progtxt">${Math.round(pct)}% given out</div></div>
    <div class="tiles"><div class="tile in"><div class="ic">📥</div><div class="l">Received · ${inc.length}</div><div class="v">${fmt(i)}</div></div>
      <div class="tile out"><div class="ic">📤</div><div class="l">Given · ${pay.length}</div><div class="v">${fmt(o)}</div></div></div>
    <div class="tiles" style="margin-top:10px">
      <div class="tile"><div class="ic" style="background:#fbf1da">💵</div><div class="l">Hand cash</div><div class="v">${fmt(hc)}</div></div>
      <div class="tile"><div class="ic" style="background:#e6eefb">📱</div><div class="l">UPI balance</div><div class="v">${fmt(i - o - hc)}</div></div></div>
    <div class="seg"><button class="i ${isIn ? 'on' : ''}" data-a="tab" data-t="inc">📥 Received</button>
      <button class="o ${!isIn ? 'on' : ''}" data-a="tab" data-t="pay">📤 Given</button></div>
    <div class="fchips">${[['all', 'All'], ['upi', 'UPI'], ['cash', 'Cash']].map(([v, l]) => `<button class="fc ${S.m === v ? 'on' : ''}" data-a="mf" data-v="${v}">${l}</button>`).join('')}<span class="ftot">${fmt(sum(items))}</span></div>
    <div class="search">${IC.search}<input id="q" placeholder="${isIn ? 'Search by name' : 'Search name or reason'}" value="${esc(S.q)}"></div>
    <div class="box">${list}</div>`,
    `<button class="fab ${isIn ? '' : 'red'}" data-a="add">${IC.plus}${isIn ? 'Add Money Received' : 'Add Money Given'}</button>`);
}

function render() {
  const keep = document.activeElement && document.activeElement.id === 'q', y = window.scrollY;
  $('app').innerHTML = S.loading ? skeleton() : S.view === 'dash' ? dashboard() : S.view === 'progs' ? progList() : progDetail();
  if (keep) { const q = $('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  window.scrollTo(0, y);
}

// ---------- forms ----------
function openForm(kind, rec = null) {
  const edit = !!rec, d = rec ? rec.date : today(), red = kind === 'pay', mm = rec ? M(rec) : 'upi';
  const chips = `<div class="chips">${[50, 100, 200, 500, 1000].map(n => `<button type="button" class="chip" data-a="chip" data-v="${n}">₹${n}</button>`).join('')}</div>`;
  const money = `<label>Amount</label><div class="money"><span>₹</span><input class="fld" id="fa" type="number" inputmode="decimal" min="0" step="any" value="${rec?.amount ?? ''}" placeholder="0"></div>${chips}
    <label>Payment method</label><div class="mseg"><button type="button" class="${mm === 'upi' ? 'on' : ''}" data-a="method" data-v="upi">📱 UPI</button><button type="button" class="${mm === 'cash' ? 'on cash' : ''}" data-a="method" data-v="cash">💵 Cash</button></div><input type="hidden" id="fm" value="${mm}">`;
  let title, hint, body;
  if (kind === 'prog') {
    title = edit ? 'Edit programme' : 'New programme'; hint = 'Just a name is enough. Date is filled in automatically.';
    body = `<label>Programme name</label><input class="fld" id="f1" value="${esc(rec?.name || '')}" placeholder="e.g. Elysium Fest" autocomplete="off" autocapitalize="words">
            <label>Date</label><input class="fld" id="fd" type="date" value="${d}">`;
  } else if (kind === 'inc') {
    title = edit ? 'Edit entry' : 'Add money received'; hint = 'Who paid and how much';
    body = `<label>Name</label><input class="fld" id="f1" value="${esc(rec?.name || '')}" placeholder="Student's name" autocomplete="off" autocapitalize="words">
            ${money}<label>Date</label><input class="fld" id="fd" type="date" value="${d}">`;
  } else {
    const names = [...new Set(S.pay.map(x => x.paid_to.trim()))];
    title = edit ? 'Edit entry' : 'Add money given'; hint = 'Who received it, how much and why';
    body = `<label>Given to</label><input class="fld" id="f1" list="pl" value="${esc(rec?.paid_to || '')}" placeholder="Ustad or person's name" autocomplete="off" autocapitalize="words">
            <datalist id="pl">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
            ${money}<label>Reason</label><input class="fld" id="fr" value="${esc(rec?.reason || '')}" placeholder="e.g. Stage materials" autocomplete="off">
            <label>Date</label><input class="fld" id="fd" type="date" value="${d}">`;
  }
  $('modal').innerHTML = `<div class="sheet"><div class="grab"></div><h3>${title}</h3><div class="hint">${hint}</div>${body}
    <div class="btns">${edit ? `<button class="btn-del" data-a="del" data-k="${kind}" data-id="${rec.id}" aria-label="Delete">🗑</button>` : ''}
    <button class="btn-x" data-a="close">Cancel</button>
    <button class="btn-save ${red ? 'red' : ''}" data-a="save" data-k="${kind}" data-id="${rec?.id || ''}">Save</button></div></div>`;
  $('modal').classList.add('show');
  if (!edit) setTimeout(() => $('f1').focus(), 80);
}
const closeModal = () => $('modal').classList.remove('show');
const TABLE = { prog: 'programmes', inc: 'incomes', pay: 'payouts' };
const LIST = { prog: 'progs', inc: 'inc', pay: 'pay' };

async function save(kind, id) {
  const v = $('f1').value.trim(), date = $('fd').value || today();
  if (!v) return toast('Please enter a name');
  let row;
  if (kind === 'prog') row = { name: v, date };
  else {
    const amount = parseFloat($('fa').value);
    if (!(amount > 0)) return toast('Enter a valid amount');
    const method = $('fm').value === 'cash' ? 'cash' : 'upi';
    row = kind === 'inc' ? { programme_id: S.pid, name: v, amount, date, method } : { programme_id: S.pid, paid_to: v, amount, date, reason: $('fr').value.trim(), method };
  }
  const btn = document.querySelector('.btn-save'); btn.disabled = true; btn.textContent = 'Saving...';
  const { data, error } = await (id ? sb.from(TABLE[kind]).update(row).eq('id', id) : sb.from(TABLE[kind]).insert(row).select());
  if (error) { btn.disabled = false; btn.textContent = 'Save'; return toast('Could not save: ' + error.message); }
  closeModal(); toast('Saved ✓'); await load();
  if (kind === 'prog' && !id && data && data[0]) { S.view = 'prog'; S.pid = data[0].id; S.tab = 'inc'; S.q = ''; window.scrollTo(0, 0); render(); }
}
async function del(kind, id) {
  if (!confirm(kind === 'prog' ? 'Delete this programme and all its entries?' : 'Delete this entry?')) return;
  const { error } = await sb.from(TABLE[kind]).delete().eq('id', id);
  if (error) return toast('Could not delete: ' + error.message);
  closeModal(); if (kind === 'prog') { S.view = 'progs'; S.pid = null; }
  toast('Deleted'); await load();
}
function csv() {
  const pn = id => (S.progs.find(p => p.id === id) || {}).name || '';
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Type', 'Programme', 'Name', 'Amount', 'Date', 'Reason', 'Method'],
    ...S.inc.map(x => ['Received', pn(x.programme_id), x.name, x.amount, x.date, '', M(x).toUpperCase()]),
    ...S.pay.map(x => ['Given', pn(x.programme_id), x.paid_to, x.amount, x.date, x.reason, M(x).toUpperCase()])];
  const blob = new Blob(['\ufeff' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `elysium-fund-${today()}.csv`; a.click();
  toast('Downloaded');
}

// ---------- events ----------
document.addEventListener('click', e => {
  if (e.target === $('modal')) return closeModal();
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (a === 'nav') { S.view = el.dataset.v; S.pid = null; S.q = ''; window.scrollTo(0, 0); return render(); }
  if (a === 'method') { $('fm').value = el.dataset.v; document.querySelectorAll('.mseg button').forEach(b => { b.classList.toggle('on', b === el); b.classList.toggle('cash', b === el && el.dataset.v === 'cash'); }); return; }
  if (a === 'mf') { S.m = el.dataset.v; return render(); }
  if (a === 'open') { S.view = 'prog'; S.pid = id; S.tab = 'inc'; S.q = ''; S.m = 'all'; window.scrollTo(0, 0); return render(); }
  if (a === 'tab') { S.tab = el.dataset.t; S.q = ''; return render(); }
  if (a === 'addprog') return openForm('prog');
  if (a === 'editprog') return openForm('prog', S.progs.find(p => p.id === S.pid));
  if (a === 'add') return openForm(S.tab);
  if (a === 'edit') return openForm(el.dataset.k, S[LIST[el.dataset.k]].find(x => x.id === id));
  if (a === 'chip') { const f = $('fa'); f.value = el.dataset.v; f.focus(); return; }
  if (a === 'save') return save(el.dataset.k, id);
  if (a === 'del') return del(el.dataset.k, id);
  if (a === 'close') return closeModal();
  if (a === 'csv') return csv();
});
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; render(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && $('modal').classList.contains('show') && e.target.tagName === 'INPUT') { const b = document.querySelector('.btn-save'); if (b) b.click(); }
});

// ---------- start ----------
if (SUPABASE_KEY.startsWith('PASTE')) {
  $('app').innerHTML = '<div class="setup"><div style="font-size:44px">🔑</div><h2>Key not added</h2><p style="color:var(--mute)">Open index.html and replace <b>PASTE_YOUR_PUBLISHABLE_KEY_HERE</b> with your Supabase publishable key.</p></div>';
} else { render(); load(); }
</script>
</body>
</html>
