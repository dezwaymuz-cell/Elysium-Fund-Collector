<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5c3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elysium Fund">
<title>Elysium Fund</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ea;--card:#fff;--ink:#16201b;--mute:#6f7a74;--line:#e8e5db;
  --g1:#0f5c3e;--g2:#1c8a5b;--green:#1a7f55;--green-bg:#e3f4ec;
  --red:#c2412d;--red-bg:#fbe9e5;
  --shadow:0 1px 2px rgba(20,30,25,.05),0 6px 18px rgba(20,30,25,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;padding-bottom:calc(40px + env(safe-area-inset-bottom));touch-action:manipulation;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.wrap{max-width:480px;margin:0 auto;padding:0 14px}

.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 0 4px}
.logo{display:flex;align-items:center;gap:10px}
.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:18px;box-shadow:0 4px 12px rgba(15,92,62,.35)}
.logo b{font-size:17px;display:block;line-height:1.1;font-weight:700}
.logo span{font-size:12px;color:var(--mute)}

.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;color:#fff;margin:12px 0;background:linear-gradient(140deg,var(--g1) 0%,var(--g2) 100%);box-shadow:0 14px 30px rgba(15,92,62,.28)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.hero:before{width:170px;height:170px;right:-50px;top:-70px}
.hero:after{width:110px;height:110px;right:50px;bottom:-65px}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:36px;font-weight:800;margin:2px 0 14px;line-height:1.1;letter-spacing:-.02em}
.hero .title{font-size:22px;font-weight:700;line-height:1.25;word-break:break-word}
.hero .sub{font-size:12.5px;opacity:.8;margin-bottom:4px}
.prog{height:8px;background:rgba(255,255,255,.22);border-radius:8px;overflow:hidden;margin:2px 0 7px}
.prog i{display:block;height:100%;background:#fff;border-radius:8px;transition:width .6s}
.progtxt{font-size:12px;opacity:.88}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.tile .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;margin-bottom:8px}
.tile.in .ic{background:var(--green-bg)}.tile.out .ic{background:var(--red-bg)}
.tile .l{font-size:12.5px;color:var(--mute)}
.tile .v{font-size:20px;font-weight:700;letter-spacing:-.01em}
.tile.in .v{color:var(--green)}.tile.out .v{color:var(--red)}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:24px 2px 10px}
.sec h2{font-size:16px;margin:0;font-weight:700}
.sec small{color:var(--mute);font-size:12.5px}
.box{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.mid{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap;text-align:right;font-size:15px}
.amt small{display:block;font-weight:500;font-size:11.5px;color:var(--mute)}
.in{color:var(--green)}.out{color:var(--red)}
.empty{padding:34px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;font-size:34px;margin-bottom:6px;font-weight:400}

.pcard{padding:14px;border-bottom:1px solid var(--line);cursor:pointer}
.pcard:last-child{border-bottom:0}.pcard:active{background:#f7f5ee}
.pcard .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pcard .bar{height:6px;border-radius:6px;background:var(--red-bg);margin:10px 0 6px;overflow:hidden}
.pcard .bar i{display:block;height:100%;background:var(--red);border-radius:6px}
.pcard .f{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute)}

.seg{display:grid;grid-template-columns:1fr 1fr;background:#e7e4da;border-radius:14px;padding:4px;margin:20px 0 12px}
.seg button{border:0;background:none;padding:12px 8px;border-radius:11px;font-weight:600;color:var(--mute);transition:.2s}
.seg button.on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.seg button.on.i{color:var(--green)}.seg button.on.o{color:var(--red)}
.datehead{font-size:12px;font-weight:600;color:var(--mute);padding:9px 14px;background:#faf9f4;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.back{border:0;background:none;color:var(--g1);font-weight:600;padding:10px 0 6px;font-size:14.5px;margin-top:4px}
.pm{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;vertical-align:middle;margin-left:4px;letter-spacing:.02em}
.pm.upi{background:#e6eefb;color:#2f5fa8}.pm.cash{background:#fbf1da;color:#a9741a}
.fchips{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.fc{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 16px;font-weight:600;font-size:14px;color:var(--mute)}
.fc.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ftot{margin-left:auto;font-weight:700;font-size:14px}
.note{text-align:center;color:var(--mute);font-size:12px;margin-top:22px}

.sk{background:linear-gradient(90deg,#ebe8de 25%,#f6f4ec 50%,#ebe8de 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:18px}
@keyframes sh{to{background-position:-200% 0}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-30px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:30px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:99;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.setup{max-width:420px;margin:14vh auto;padding:0 20px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== Paste your Supabase publishable key below (same key as admin/index.html) ======
const SUPABASE_URL = 'https://vnmirsymtiyaqrscalfe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bCb0uRgNbIINlSJ_VwSOLw_7vyLZOAv';
// =======================================================================================

// READ-ONLY VIEW: this page only ever calls .select(). There are no add, edit or delete controls.

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const S = { progs: [], inc: [], pay: [], tab: 'inc', m: 'all', loading: true };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const today = () => new Date().toLocaleDateString('en-CA');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dlong = d => { const [y, m, dd] = String(d).split('-'); return `${+dd} ${MON[+m - 1]} ${y}`; };
const dnice = d => d === today() ? 'Today' : d === new Date(Date.now() - 864e5).toLocaleDateString('en-CA') ? 'Yesterday' : dlong(d);
const sum = a => a.reduce((t, x) => t + Number(x.amount || 0), 0);
const M = x => x.method === 'cash' ? 'cash' : 'upi';
const badge = x => `<span class="pm ${M(x)}">${M(x) === 'cash' ? 'Cash' : 'UPI'}</span>`;
const handCash = (inc, pay) => sum(inc.filter(x => M(x) === 'cash')) - sum(pay.filter(x => M(x) === 'cash'));
const byDate = (a, b) => b.date.localeCompare(a.date) || (b.created_at || '').localeCompare(a.created_at || '');
const PAL = [['#e3f4ec','#1a7f55'],['#fbf1da','#a9741a'],['#e6eefb','#2f5fa8'],['#f6e6f3','#a1348f'],['#fbe9e5','#c2412d'],['#e5f3f5','#1b7a89']];
const avatar = n => { const s = String(n).trim(); let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0; const [bg, fg] = PAL[h % PAL.length]; return `<div class="av" style="background:${bg};color:${fg}">${esc([...s][0] || '?').toUpperCase()}</div>`; };
const curId = () => decodeURIComponent((location.hash.match(/^#p=(.+)$/) || [])[1] || '');

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2500); }

async function fetchAll(table) {
  let all = [], from = 0;
  while (true) {
    const { data, error } = await sb.from(table).select('*').range(from, from + 999);
    if (error) throw error;
    all = all.concat(data); if (data.length < 1000) break; from += 1000;
  }
  return all;
}
async function load() {
  try {
    [S.progs, S.inc, S.pay] = await Promise.all([fetchAll('programmes'), fetchAll('incomes'), fetchAll('payouts')]);
    S.progs.sort((a, b) => b.date.localeCompare(a.date) || b.created_at.localeCompare(a.created_at));
  } catch (e) { toast('Could not load: ' + e.message); }
  S.loading = false; render();
}

function shell(inner) {
  return `<div class="wrap"><div class="top"><div class="logo"><i>✦</i><div><b>Elysium Fund</b><span>Fest accounts</span></div></div></div>${inner}
    <div class="note">View only</div></div>`;
}

function progRow(p) {
  const i = sum(S.inc.filter(x => x.programme_id === p.id)), o = sum(S.pay.filter(x => x.programme_id === p.id));
  const pct = i > 0 ? Math.min(100, o / i * 100) : 0;
  return `<div class="pcard" data-id="${esc(p.id)}"><div class="h">
      <div class="mid"><div class="t" style="font-size:16px">${esc(p.name)}</div><div class="s">${dlong(p.date)}</div></div>
      <div class="amt ${i - o >= 0 ? 'in' : 'out'}" style="font-size:17px">${fmt(i - o)}<small>balance</small></div></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="f"><span>Received <b class="in">${fmt(i)}</b></span><span>Given <b class="out">${fmt(o)}</b></span></div></div>`;
}

function home() {
  return shell(`<div class="sec" style="margin-top:18px"><h2>Programmes</h2><small>${S.progs.length} total</small></div>
    <div class="box">${S.progs.map(progRow).join('') || '<div class="empty"><b>🎪</b>No programmes yet</div>'}</div>`);
}

function detail(p) {
  const inc = S.inc.filter(x => x.programme_id === p.id), pay = S.pay.filter(x => x.programme_id === p.id);
  const i = sum(inc), o = sum(pay), pct = i > 0 ? Math.min(100, o / i * 100) : 0, isIn = S.tab === 'inc';

  const hc = handCash(inc, pay);
  const items = (isIn ? inc : pay).filter(x => S.m === 'all' || M(x) === S.m).sort(byDate);
  let list = '', last = '';
  items.forEach(x => {
    if (x.date !== last) { list += `<div class="datehead"><span>${dnice(x.date)}</span><span>${fmt(sum(items.filter(y => y.date === x.date)))}</span></div>`; last = x.date; }
    const who = isIn ? x.name : x.paid_to;
    list += `<div class="row">${avatar(who)}<div class="mid"><div class="t">${esc(who)} ${badge(x)}</div>${!isIn && x.reason ? `<div class="s">${esc(x.reason)}</div>` : ''}</div>
      <div class="amt ${isIn ? 'in' : 'out'}">${isIn ? '+' : '−'}${fmt(x.amount)}</div></div>`;
  });
  if (!items.length) list = `<div class="empty"><b>${isIn ? '💰' : '🤝'}</b>${isIn ? 'No money received yet' : 'Nothing given out yet'}</div>`;

  let givenTo = '';
  if (!isIn && items.length) {
    const g = {};
    items.forEach(x => { const k = x.paid_to.trim().toLowerCase(); g[k] = g[k] || { name: x.paid_to.trim(), total: 0, n: 0 }; g[k].total += Number(x.amount); g[k].n++; });
    givenTo = `<div class="sec" style="margin-top:0"><h2>Given to</h2><small>${Object.keys(g).length} ${Object.keys(g).length > 1 ? 'people' : 'person'}</small></div><div class="box" style="margin-bottom:18px">` +
      Object.values(g).sort((a, b) => b.total - a.total).map(x => `<div class="row">${avatar(x.name)}<div class="mid"><div class="t">${esc(x.name)}</div><div class="s">${x.n} payment${x.n > 1 ? 's' : ''}</div></div><div class="amt out">${fmt(x.total)}</div></div>`).join('') + `</div>
      <div class="sec" style="margin-top:0"><h2>All payments</h2></div>`;
  }

  return shell(`<button class="back" id="back">‹ All programmes</button>
    <div class="hero" style="margin-top:4px"><div class="sub">${dlong(p.date)}</div><div class="title">${esc(p.name)}</div>
      <div class="lbl" style="margin-top:14px">Balance</div><div class="big">${fmt(i - o)}</div>
      <div class="prog"><i style="width:${pct}%"></i></div><div class="progtxt">${Math.round(pct)}% given out</div></div>
    <div class="tiles"><div class="tile in"><div class="ic">📥</div><div class="l">Received · ${inc.length}</div><div class="v">${fmt(i)}</div></div>
      <div class="tile out"><div class="ic">📤</div><div class="l">Given · ${pay.length}</div><div class="v">${fmt(o)}</div></div></div>
    <div class="tiles" style="margin-top:10px">
      <div class="tile"><div class="ic" style="background:#fbf1da">💵</div><div class="l">Hand cash</div><div class="v">${fmt(hc)}</div></div>
      <div class="tile"><div class="ic" style="background:#e6eefb">📱</div><div class="l">UPI balance</div><div class="v">${fmt(i - o - hc)}</div></div></div>
    <div class="seg"><button class="i ${isIn ? 'on' : ''}" data-t="inc">📥 Received</button><button class="o ${!isIn ? 'on' : ''}" data-t="pay">📤 Given</button></div>
    <div class="fchips">${[['all', 'All'], ['upi', 'UPI'], ['cash', 'Cash']].map(([v, l]) => `<button class="fc ${S.m === v ? 'on' : ''}" data-m="${v}">${l}</button>`).join('')}<span class="ftot">${fmt(sum(items))}</span></div>
    ${givenTo}<div class="box">${list}</div>`);
}

function render() {
  if (S.loading) { $('app').innerHTML = shell('<div class="sk" style="height:110px;margin-top:18px"></div><div class="sk" style="height:110px;margin-top:12px"></div><div class="sk" style="height:110px;margin-top:12px"></div>'); return; }
  const id = curId(), p = id && S.progs.find(x => x.id === id);
  $('app').innerHTML = p ? detail(p) : home();
}

document.addEventListener('click', e => {
  const card = e.target.closest('.pcard');
  if (card) { S.tab = 'inc'; S.m = 'all'; location.hash = 'p=' + encodeURIComponent(card.dataset.id); window.scrollTo(0, 0); return; }
  if (e.target.closest('#back')) { location.hash = ''; history.replaceState(null, '', location.pathname + location.search); render(); window.scrollTo(0, 0); return; }
  const mb = e.target.closest('[data-m]');
  if (mb) { S.m = mb.dataset.m; render(); return; }
  const tb = e.target.closest('[data-t]');
  if (tb) { S.tab = tb.dataset.t; render(); }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !S.loading) load(); });

if (SUPABASE_KEY.startsWith('PASTE')) {
  $('app').innerHTML = '<div class="setup"><div style="font-size:44px">🔑</div><h2>Key not added</h2><p style="color:var(--mute)">Open index.html and replace <b>PASTE_YOUR_PUBLISHABLE_KEY_HERE</b> with your Supabase publishable key.</p></div>';
} else { render(); load(); }
</script>
</body>
</html>
